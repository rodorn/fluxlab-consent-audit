[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxlab-consent-audit"
version = "0.1.0"
description = "Skaner i audyt Consent Mode v2 / zgod cookie (GTM) dla polskich sklepow na Google Ads"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FluxLab" }]
keywords = ["consent-mode", "gtm", "gdpr", "google-ads", "cookie", "playwright"]

# Runtime dziala bez zaleznosci w trybie fallback (tylko biblioteka standardowa).
# Playwright jest opcjonalny i wlacza tryb live (przechwytywanie ruchu sieciowego).
dependencies = []

[project.optional-dependencies]
live = ["playwright>=1.40"]
dev = ["playwright>=1.40", "pytest>=7"]

[project.scripts]
consent-audit = "consent_audit.cli:main"

[project.urls]
Homepage = "https://fluxlab.pl"

[tool.setuptools]
packages = ["consent_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
